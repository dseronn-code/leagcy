# Testes na RTX do dono, sem ninguém na frente do PC.
# Quem tem acesso de escrita ao repositório escreve o comando em engine/pedido_rtx.txt e envia (push) para o branch de
# trabalho; o runner instalado no PC (docs/runner_rtx.md) atualiza a pasta do motor, compila, roda o comando e publica
# a saída e as imagens de resultados_pc no branch "resultados-rtx". Só dispara por push (nunca por pull request de
# fork), e só no branch de trabalho.
name: Teste na RTX

on:
  push:
    branches: [ccr-5423dd89-y3br6e]
    paths: [engine/pedido_rtx.txt]

permissions:
  contents: write

concurrency:
  group: rtx
  cancel-in-progress: false

jobs:
  rtx:
    runs-on: [self-hosted, Windows, rtx]
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell
    env:
      PASTA: C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\leagcy\engine
      BRANCH: ${{ github.ref_name }}
      TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Atualizar o código na pasta do motor
        run: |
          Set-Location $env:PASTA
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:TOKEN"))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch origin $env:BRANCH
          if ($LASTEXITCODE) { exit 1 }
          git checkout $env:BRANCH
          git merge --ff-only "origin/$env:BRANCH"   # nunca apaga mudança local: se houver, para aqui
          if ($LASTEXITCODE) { exit 1 }
          git log --oneline -1

      - name: Compilar
        run: |
          Set-Location $env:PASTA
          cmd /c "cmake --build build --config Release > %RUNNER_TEMP%\compilacao.txt 2>&1"
          $code = $LASTEXITCODE
          Get-Content -Encoding UTF8 "$env:RUNNER_TEMP\compilacao.txt" | Select-String -Pattern 'error|warning C|-> .*legacy\.exe'
          exit $code

      - name: Rodar o pedido
        run: |
          Set-Location $env:PASTA
          if (Test-Path resultados_pc) { Remove-Item -Recurse -Force resultados_pc }
          New-Item -ItemType Directory resultados_pc | Out-Null
          $saida = 'resultados_pc\saida.txt'
          $comandos = Get-Content -Encoding UTF8 pedido_rtx.txt | Where-Object { $_.Trim() -and -not $_.Trim().StartsWith('#') }
          $falhou = 0
          foreach ($c in $comandos) {
            [IO.File]::AppendAllText("$env:PASTA\$saida", "`n>>> $c`n")
            cmd /c "$c >> $saida 2>&1"   # saída em UTF-8, como o motor escreve
            if ($LASTEXITCODE) { [IO.File]::AppendAllText("$env:PASTA\$saida", "!!! código $LASTEXITCODE`n"); $falhou = 1 }
          }
          Get-Content -Encoding UTF8 $saida
          exit $falhou

      - name: Publicar resultados no branch resultados-rtx
        if: always()
        run: |
          Set-Location $env:PASTA
          $out = Join-Path $env:RUNNER_TEMP 'resultados'
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory $out | Out-Null
          if (Test-Path resultados_pc) { Copy-Item -Recurse resultados_pc\* $out }
          Copy-Item "$env:RUNNER_TEMP\compilacao.txt" $out -ErrorAction SilentlyContinue
          Copy-Item pedido_rtx.txt $out
          git log --oneline -1 | Out-File -Encoding ascii "$out\commit.txt"
          Set-Location $out
          git init -q
          git checkout -q -b resultados
          git add -A
          git -c user.name=runner-rtx -c user.email=runner-rtx@localhost commit -q -m "Resultados da RTX (run ${{ github.run_number }})"
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:TOKEN"))
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push --force "https://github.com/${{ github.repository }}.git" HEAD:refs/heads/resultados-rtx
